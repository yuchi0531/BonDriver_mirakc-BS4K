[GLOBAL]
; 接続先(TCP)
SERVER_HOST="localhost"
SERVER_PORT=40772

; 接続方式: "http" または "unix"(Linux のみ)
; "unix" の場合は SERVER_SOCKPATH で Unix ドメインソケットを指定する。
SERVER_TYPE="http"
SERVER_SOCKPATH=""

; B25(1=enable)
DECODE_B25=0

; Priority(0=Low Priority)
PRIORITY=0

; Service Split(1=enable)
SERVICE_SPLIT=0

; チューナー固定(mirakc-BS4K 独自機能)。
; 値を指定すると、channel stream 取得時に `X-Mirakc-Tuner: <値>` ヘッダを送り、
; mirakc 側で該当名のチューナーを厳密に使用させる(フォールバックなし)。
; 空欄ならルート選択に任せる。サーバの config.tuners[].name と一致させること。
; また、指定したチューナーの対応放送種別(types)のみをチャンネル一覧に表示する
; (衛星専用チューナーに地上波が表示されて 404 になるのを防ぐ)。
TUNER=""
