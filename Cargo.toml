[package]
name = "bondriver_mirakurun"
version = "2.2.0"
edition = "2024"
description = "BonDriver for Mirakurun/mirakc (Rust, Windows x86/x64 + Linux x64)"
license = "MIT"

# 出力名を固定する。
#   Windows: BonDriver_Mirakurun.dll
#   Linux  : libBonDriver_Mirakurun.so (ビルドスクリプトで BonDriver_Mirakurun.so に複製)
[lib]
name = "BonDriver_Mirakurun"
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"

# Win32 API は Windows ターゲットでのみ必要。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# FFI(extern "C") 境界を Rust の unwind が越えると Windows では
# STATUS_STACK_BUFFER_OVERRUN (0xC0000409) で即死する。panic を abort に
# 固定してこの未定義動作を根絶する。
panic = "abort"
